<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 436" width="1200" height="436" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#050607"/></marker><marker id="ahh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c2410c"/></marker><marker id="ahs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#859099"/></marker></defs><text letter-spacing="0.6" x="40" y="48" font-size="15" fill="#5b646b" font-weight="600" text-anchor="start">THE OLD WAY: A TOKEN YOU KEEP</text><rect x="40" y="70" width="240" height="76" fill="none" stroke="#050607" stroke-width="2"/><text x="160.0" y="104.0" font-size="20" fill="#050607" font-weight="600" text-anchor="middle">registry</text><text x="160.0" y="128.0" font-size="16" fill="#5b646b" font-weight="400" text-anchor="middle">make a token</text><path d="M280 108.0 L328 108.0" fill="none" stroke="#859099" stroke-width="1.5" marker-end="url(#ahs)"/><rect x="330" y="70" width="240" height="76" fill="none" stroke="#050607" stroke-width="2"/><text x="450.0" y="104.0" font-size="20" fill="#050607" font-weight="600" text-anchor="middle">you</text><text x="450.0" y="128.0" font-size="16" fill="#5b646b" font-weight="400" text-anchor="middle">copy, paste</text><path d="M570 108.0 L618 108.0" fill="none" stroke="#859099" stroke-width="1.5" marker-end="url(#ahs)"/><rect x="620" y="70" width="240" height="76" fill="none" stroke="#050607" stroke-width="2"/><text x="740.0" y="104.0" font-size="20" fill="#050607" font-weight="600" text-anchor="middle">GitHub secret</text><text x="740.0" y="128.0" font-size="16" fill="#5b646b" font-weight="400" text-anchor="middle">stored for months</text><path d="M860 108.0 L908 108.0" fill="none" stroke="#859099" stroke-width="1.5" marker-end="url(#ahs)"/><rect x="910" y="70" width="240" height="76" fill="none" stroke="#050607" stroke-width="2"/><text x="1030.0" y="104.0" font-size="20" fill="#050607" font-weight="600" text-anchor="middle">workflow</text><text x="1030.0" y="128.0" font-size="16" fill="#5b646b" font-weight="400" text-anchor="middle">sends the token</text><text x="40" y="186" font-size="18" fill="#c2410c" font-weight="400" text-anchor="start">Works from any machine that has it, until someone remembers to revoke it.</text><text letter-spacing="0.6" x="40" y="268" font-size="15" fill="#5b646b" font-weight="600" text-anchor="start">TRUSTED PUBLISHING: NOTHING TO KEEP</text><rect x="40" y="290" width="240" height="76" fill="#dde1e4" stroke="#050607" stroke-width="2"/><text x="160.0" y="324.0" font-size="20" fill="#050607" font-weight="600" text-anchor="middle">workflow</text><text x="160.0" y="348.0" font-size="16" fill="#5b646b" font-weight="400" text-anchor="middle">asks for an ID token</text><path d="M280 328.0 L328 328.0" fill="none" stroke="#859099" stroke-width="1.5" marker-end="url(#ahs)"/><rect x="330" y="290" width="240" height="76" fill="#dde1e4" stroke="#050607" stroke-width="2"/><text x="450.0" y="324.0" font-size="20" fill="#050607" font-weight="600" text-anchor="middle">GitHub</text><text x="450.0" y="348.0" font-size="16" fill="#5b646b" font-weight="400" text-anchor="middle">signs repo, workflow, env</text><path d="M570 328.0 L618 328.0" fill="none" stroke="#859099" stroke-width="1.5" marker-end="url(#ahs)"/><rect x="620" y="290" width="240" height="76" fill="#dde1e4" stroke="#050607" stroke-width="2"/><text x="740.0" y="324.0" font-size="20" fill="#050607" font-weight="600" text-anchor="middle">registry</text><text x="740.0" y="348.0" font-size="16" fill="#5b646b" font-weight="400" text-anchor="middle">checks the claims</text><path d="M860 328.0 L908 328.0" fill="none" stroke="#859099" stroke-width="1.5" marker-end="url(#ahs)"/><rect x="910" y="290" width="240" height="76" fill="#dde1e4" stroke="#050607" stroke-width="2"/><text x="1030.0" y="324.0" font-size="20" fill="#050607" font-weight="600" text-anchor="middle">workflow</text><text x="1030.0" y="348.0" font-size="16" fill="#5b646b" font-weight="400" text-anchor="middle">gets a token for minutes</text><text x="40" y="406" font-size="18" fill="#050607" font-weight="400" text-anchor="start">Only this repository's release workflow, in this environment, can publish. There is nothing to leak.</text></svg>