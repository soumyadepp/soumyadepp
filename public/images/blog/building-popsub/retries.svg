<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#050607"/></marker><marker id="ahh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c2410c"/></marker><marker id="ahs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#859099"/></marker></defs><text letter-spacing="0.6" x="60" y="40" font-size="15" fill="#5b646b" font-weight="600" text-anchor="start">A MESSAGE NOBODY ACKNOWLEDGES</text><line x1="60" y1="180" x2="1140" y2="180" stroke="#859099" stroke-width="1"/><circle cx="120" cy="180" r="10" fill="#050607" stroke="#050607" stroke-width="2"/><text x="120" y="150" font-size="18" fill="#050607" font-weight="600" text-anchor="middle">Publish</text><text x="120" y="222" font-size="17" fill="#5b646b" font-weight="400" text-anchor="middle">0 s</text><line x1="134" y1="180" x2="276" y2="180" stroke="#859099" stroke-width="1.5" marker-end="url(#ahs)"/><circle cx="290" cy="180" r="10" fill="#050607" stroke="#050607" stroke-width="2"/><text x="290" y="150" font-size="18" fill="#050607" font-weight="600" text-anchor="middle">Retry 1</text><text x="290" y="222" font-size="17" fill="#5b646b" font-weight="400" text-anchor="middle">5 s</text><line x1="304" y1="180" x2="446" y2="180" stroke="#859099" stroke-width="1.5" marker-end="url(#ahs)"/><circle cx="460" cy="180" r="10" fill="#050607" stroke="#050607" stroke-width="2"/><text x="460" y="150" font-size="18" fill="#050607" font-weight="600" text-anchor="middle">Retry 2</text><text x="460" y="222" font-size="17" fill="#5b646b" font-weight="400" text-anchor="middle">10 s</text><line x1="474" y1="180" x2="616" y2="180" stroke="#859099" stroke-width="1.5" marker-end="url(#ahs)"/><circle cx="630" cy="180" r="10" fill="#050607" stroke="#050607" stroke-width="2"/><text x="630" y="150" font-size="18" fill="#050607" font-weight="600" text-anchor="middle">Retry 3</text><text x="630" y="222" font-size="17" fill="#5b646b" font-weight="400" text-anchor="middle">15 s</text><line x1="644" y1="180" x2="786" y2="180" stroke="#859099" stroke-width="1.5" marker-end="url(#ahs)"/><circle cx="800" cy="180" r="10" fill="#050607" stroke="#050607" stroke-width="2"/><text x="800" y="150" font-size="18" fill="#050607" font-weight="600" text-anchor="middle">Retry 4</text><text x="800" y="222" font-size="17" fill="#5b646b" font-weight="400" text-anchor="middle">20 s</text><line x1="814" y1="180" x2="956" y2="180" stroke="#859099" stroke-width="1.5" marker-end="url(#ahs)"/><circle cx="970" cy="180" r="10" fill="#050607" stroke="#050607" stroke-width="2"/><text x="970" y="150" font-size="18" fill="#050607" font-weight="600" text-anchor="middle">Retry 5</text><text x="970" y="222" font-size="17" fill="#5b646b" font-weight="400" text-anchor="middle">25 s</text><line x1="984" y1="180" x2="1126" y2="180" stroke="#859099" stroke-width="1.5" marker-end="url(#ahs)"/><circle cx="1140" cy="180" r="10" fill="#c2410c" stroke="#c2410c" stroke-width="2"/><text x="1140" y="150" font-size="18" fill="#c2410c" font-weight="600" text-anchor="middle">Dropped</text><text x="1140" y="222" font-size="17" fill="#5b646b" font-weight="400" text-anchor="middle">30 s</text><text x="60" y="300" font-size="20" fill="#050607" font-weight="400" text-anchor="start">Defaults: wait 5 seconds for an acknowledgement, retry 5 times, then give up.</text><text x="60" y="332" font-size="20" fill="#5b646b" font-weight="400" text-anchor="start">An acknowledgement at any point removes the message from the pending table.</text></svg>