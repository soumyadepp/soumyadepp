<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 530" width="1200" height="530" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#050607"/></marker><marker id="ahh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c2410c"/></marker><marker id="ahs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#859099"/></marker></defs><text letter-spacing="0.6" x="40" y="40" font-size="15" fill="#5b646b" font-weight="600" text-anchor="start">ONE TAG, EVERY REGISTRY</text><rect x="40" y="220" width="150" height="70" fill="none" stroke="#050607" stroke-width="2"/><text x="115.0" y="251.0" font-size="20" fill="#050607" font-weight="600" text-anchor="middle">git push</text><text x="115.0" y="275.0" font-size="16" fill="#5b646b" font-weight="400" text-anchor="middle">the tag v1.4.0</text><rect x="240" y="220" width="160" height="70" fill="none" stroke="#050607" stroke-width="2"/><text x="320.0" y="251.0" font-size="20" fill="#050607" font-weight="600" text-anchor="middle">check</text><text x="320.0" y="275.0" font-size="16" fill="#5b646b" font-weight="400" text-anchor="middle">versions, tests</text><path d="M190 255 L238 255" fill="none" stroke="#050607" stroke-width="2" marker-end="url(#ah)"/><text letter-spacing="0.6" x="460" y="93" font-size="15" fill="#5b646b" font-weight="600" text-anchor="start">BUILD AND SHIP, NO APPROVAL</text><text letter-spacing="0.6" x="460" y="435" font-size="15" fill="#5b646b" font-weight="600" text-anchor="start">PUBLISH, AFTER A HUMAN SAYS YES</text><rect x="460" y="110" width="200" height="70" fill="#dde1e4" stroke="#050607" stroke-width="2"/><text x="560.0" y="141.0" font-size="20" fill="#050607" font-weight="600" text-anchor="middle">build</text><text x="560.0" y="165.0" font-size="16" fill="#5b646b" font-weight="400" text-anchor="middle">downloads, an image</text><rect x="720" y="110" width="240" height="70" fill="#dde1e4" stroke="#050607" stroke-width="2"/><text x="840.0" y="141.0" font-size="20" fill="#050607" font-weight="600" text-anchor="middle">GitHub, ghcr.io</text><text x="840.0" y="165.0" font-size="16" fill="#5b646b" font-weight="400" text-anchor="middle">the run's own token</text><rect x="460" y="330" width="200" height="70" fill="none" stroke="#c2410c" stroke-width="2" stroke-dasharray="7 6"/><text x="560.0" y="361.0" font-size="20" fill="#c2410c" font-weight="600" text-anchor="middle">approve</text><text x="560.0" y="385.0" font-size="16" fill="#c2410c" font-weight="400" text-anchor="middle">one click, on purpose</text><rect x="720" y="330" width="240" height="70" fill="#dde1e4" stroke="#050607" stroke-width="2"/><text x="840.0" y="361.0" font-size="20" fill="#050607" font-weight="600" text-anchor="middle">npm, PyPI</text><text x="840.0" y="385.0" font-size="16" fill="#5b646b" font-weight="400" text-anchor="middle">OIDC, no stored token</text><path d="M400 255 L430 255 L430 145 L458 145" fill="none" stroke="#050607" stroke-width="2" marker-end="url(#ah)"/><path d="M400 255 L430 255 L430 365 L458 365" fill="none" stroke="#c2410c" stroke-width="2" marker-end="url(#ahh)"/><path d="M660 145 L718 145" fill="none" stroke="#050607" stroke-width="2" marker-end="url(#ah)"/><path d="M660 365 L718 365" fill="none" stroke="#050607" stroke-width="2" marker-end="url(#ah)"/><rect x="1010" y="220" width="150" height="70" fill="none" stroke="#050607" stroke-width="2"/><text x="1085.0" y="251.0" font-size="20" fill="#050607" font-weight="600" text-anchor="middle">verify</text><text x="1085.0" y="275.0" font-size="16" fill="#5b646b" font-weight="400" text-anchor="middle">is it really there?</text><path d="M960 145 L985 145 L985 255 L1008 255" fill="none" stroke="#050607" stroke-width="2" marker-end="url(#ah)"/><path d="M960 365 L985 365 L985 255 L1008 255" fill="none" stroke="#050607" stroke-width="2" marker-end="url(#ah)"/><text x="40" y="505" font-size="18" fill="#050607" font-weight="400" text-anchor="start">Building starts at once. Publishing waits at the orange gate, so a typo in a tag stops before a registry sees it.</text></svg>