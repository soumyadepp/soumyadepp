<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#050607"/></marker><marker id="ahh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c2410c"/></marker><marker id="ahs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#859099"/></marker></defs><text letter-spacing="0.6" x="40" y="40" font-size="15" fill="#5b646b" font-weight="600" text-anchor="start">ONE JOB, THREE MACHINES, FAIL-FAST ON</text><rect x="40" y="175" width="230" height="90" fill="none" stroke="#050607" stroke-width="2"/><text x="155.0" y="216.0" font-size="20" fill="#050607" font-weight="600" text-anchor="middle">binaries</text><text x="155.0" y="240.0" font-size="16" fill="#5b646b" font-weight="400" text-anchor="middle">matrix of 3 runners</text><path d="M270 220 L330 220 L330 120 L418 120" fill="none" stroke="#859099" stroke-width="1.5" marker-end="url(#ahs)"/><rect x="420" y="85" width="280" height="70" fill="none" stroke="#050607" stroke-width="2"/><text x="560.0" y="116.0" font-size="20" fill="#050607" font-weight="600" text-anchor="middle">ubuntu-latest</text><text x="560.0" y="140.0" font-size="16" fill="#5b646b" font-weight="400" text-anchor="middle">Linux x64</text><path d="M700 120 L788 120" fill="none" stroke="#859099" stroke-width="1.5" marker-end="url(#ahs)"/><text x="800" y="127" font-size="20" fill="#050607" font-weight="600" text-anchor="start">done</text><path d="M270 220 L330 220 L330 230 L418 230" fill="none" stroke="#859099" stroke-width="1.5" marker-end="url(#ahs)"/><rect x="420" y="195" width="280" height="70" fill="none" stroke="#c2410c" stroke-width="2"/><text x="560.0" y="226.0" font-size="20" fill="#c2410c" font-weight="600" text-anchor="middle">ubuntu-24.04-arm</text><text x="560.0" y="250.0" font-size="16" fill="#c2410c" font-weight="400" text-anchor="middle">Linux ARM</text><path d="M700 230 L788 230" fill="none" stroke="#859099" stroke-width="1.5" marker-end="url(#ahs)"/><text x="800" y="237" font-size="20" fill="#c2410c" font-weight="600" text-anchor="start">failed</text><path d="M270 220 L330 220 L330 340 L418 340" fill="none" stroke="#859099" stroke-width="1.5" marker-end="url(#ahs)"/><rect x="420" y="305" width="280" height="70" fill="none" stroke="#5b646b" stroke-width="2" stroke-dasharray="7 6"/><text x="560.0" y="336.0" font-size="20" fill="#5b646b" font-weight="600" text-anchor="middle">macos-latest</text><text x="560.0" y="360.0" font-size="16" fill="#5b646b" font-weight="400" text-anchor="middle">macOS ARM</text><path d="M700 340 L788 340" fill="none" stroke="#859099" stroke-width="1.5" marker-end="url(#ahs)"/><text x="800" y="347" font-size="20" fill="#5b646b" font-weight="600" text-anchor="start">cancelled by GitHub</text><text x="40" y="440" font-size="18" fill="#050607" font-weight="400" text-anchor="start">Each matrix entry runs on its own machine at the same time. With fail-fast, the first failure cancels</text><text x="40" y="468" font-size="18" fill="#050607" font-weight="400" text-anchor="start">whatever is still running, so a release never goes out with two of its three downloads.</text></svg>